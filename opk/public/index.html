<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPK 업무 도구</title>
<style>
/*
VOICE: 조용한 사무실 서랍장. 도구는 서랍 하나씩, 밝은 것은 종이(계약서)와 메일 한 통뿐.
IDEA: 왼쪽 서랍 라벨(사이드 메뉴)을 당기면 그 서랍의 작업대가 펼쳐진다.
PICTURE: 각 도구의 실제 결과물 — A4 계약서 원본, 받는 사람 메일 화면.
COLOUR and TYPE: 먹색/종이색 두 테마, OPK 그린 #6eb92b 하나. Pretendard 4단계.
LAYOUT: 왼쪽 208px 고정 메뉴, 오른쪽 작업대. 800px 아래는 메뉴가 아래 탭 막대로.
*/

@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-SemiBold.woff2") format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Bold.woff2") format("woff2");font-weight:700 900;font-display:swap}
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121312);--panel:light-dark(#ffffff,#1b1c1b);--panel2:light-dark(#f2f4f7,#242624);--line:light-dark(#e4e7ec,#2f322f);--line2:light-dark(#c9ced6,#4d524b);--ink:light-dark(#101318,#ededeb);--mute:light-dark(#5d636d,#a3a7a2);--green:#6eb92b;--green2:#8fd14f;--warn:light-dark(#a8710c,#e5a83b);--err:light-dark(#c4363a,#ef6b6e);--barbg:light-dark(rgba(255,255,255,.92),rgba(18,19,18,.92));--sh:light-dark(rgba(16,24,40,.10),rgba(0,0,0,.5));--navbg:light-dark(#f7f8fa,#0c0d0c);--desk:light-dark(#f2f4f7,transparent);--paperline:light-dark(#e4e7ec,transparent)}
#ct .desk{background:var(--desk)}
:root{--shs:light-dark(rgba(16,24,40,.07),rgba(0,0,0,.35))}
#ct .thumb,#sg .mini{box-shadow:0 1px 2px var(--shs)!important}
#ct .paper,#sg .mail{box-shadow:0 2px 10px var(--shs)!important}
#ct .card:hover{transform:none}
#ct .paper,#ct .thumb,#ct .tp .tbox,#sg .mini,#sg .mail{outline:1px solid var(--paperline)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=light]{color-scheme:light!important}:root[data-mode=dark]{color-scheme:dark!important}
*{box-sizing:border-box;min-width:0}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.nav{position:fixed;left:0;top:0;bottom:0;width:208px;z-index:40;display:flex;flex-direction:column;gap:4px;padding:18px 12px;background:var(--navbg);border-right:1px solid var(--line)}
.nav .logo{display:flex;align-items:center;gap:10px;padding:2px 10px 18px}
.nav .logo>svg{width:44px;height:30px;flex:none}
.nav .logo b{font-size:15px;line-height:1.2}
.nav a{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px}
.nav a:hover{color:var(--ink);background:var(--panel2)}
.nav a.on{background:var(--panel);color:var(--ink)}
.nav a.on svg{color:var(--green)}
.nav a svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[hidden]{display:none}
.nav .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.nav .label{margin:0 10px;font-size:12px;color:var(--mute)}
.theme{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:999px;padding:3px}
.theme button{height:32px;border:0;border-radius:999px;background:none;font-size:12px;font-weight:600;color:var(--mute)}
.theme button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px var(--sh)}
.nav :focus-visible{outline:2px solid var(--green);outline-offset:-2px}
.main{margin-left:208px;min-height:100vh;transition:margin-left .18s}
.nav{transition:width .18s,padding .18s}
.nav .logo{position:relative}
.navtg{margin-left:auto;width:36px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--mute)}
.navtg:hover{color:var(--ink);background:var(--panel2)}
.nav .logo .navtg svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn{justify-content:center;color:var(--ink)}
.btn.pri{color:#0d1a05}
.dlg .row .btn{min-width:72px}
.thc{display:none;height:40px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--mute);font-size:11px;font-weight:600}
body.navmin .nav{width:64px;padding:18px 12px;align-items:center}
body.navmin .nav .logo{padding:0 0 18px;justify-content:center;width:40px}
body.navmin .navtg{width:40px;height:40px}
body.navmin .nav a{width:40px;height:40px}
body.navmin .nav .foot{width:40px}
.navtg:focus-visible{outline:2px solid var(--green);outline-offset:-2px}
body.navmin .nav .logo>svg,body.navmin .nav .logo b,body.navmin .nav a span,body.navmin .nav .label,body.navmin .theme{display:none}
body.navmin .navtg{margin:0}
body.navmin .nav a{justify-content:center;padding:0}
body.navmin .thc{display:block}
body.navmin .main{margin-left:64px}
@media(prefers-reduced-motion:reduce){.main,.nav,.navtg svg{transition:none}}
.main .brand svg{display:none}
.main .bar{min-height:65px}
.main .brand b{font-size:17px;line-height:1.3}
.busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:70;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:18px 22px;font-weight:600;box-shadow:0 20px 60px var(--sh)}
.busy[hidden]{display:none}
#ct .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;flex:none}
#ct .lang button{height:32px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--mute)}
#ct .lang button.on{background:var(--ink);color:var(--bg)}
#ct .lang button.miss{opacity:.55}
#ct .menu-list .mh{margin:4px 12px 4px;font-size:12px;color:var(--mute)}
#ct .menu-list hr{border:0;border-top:1px solid var(--line);margin:6px}

#ct #ftb{flex-direction:column;align-items:stretch;gap:0;padding:4px;max-width:calc(100vw - 16px);width:max-content;border-radius:12px;box-shadow:0 2px 10px var(--shs)}
#ct #ftb .fr{display:flex;align-items:center;gap:2px;flex-wrap:nowrap;padding:2px}
#ct #ftb .fr[hidden]{display:none}
#ct #ftb .fr+.fr{border-top:1px solid var(--line);margin-top:2px;padding-top:4px}
#ct #ftb button{white-space:nowrap;flex:none;height:32px;min-width:32px;padding:0 6px;border:0;background:transparent;border-radius:7px;font:600 12px "Pretendard",sans-serif;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:2px}
#ct #ftb button:hover,#ct #ftb button[aria-expanded=true]{background:var(--panel2)}
#ct #ftb button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#ct #ftb button svg.car{width:10px;height:10px;opacity:.6}
#ct #ftb .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
#ct #ftb .lab{font-size:11px;color:var(--mute);margin:0 2px 0 4px;white-space:nowrap}
#ct #ftb .pop{position:relative;display:inline-flex}
#ct #ftb .pp{position:absolute;top:38px;right:0;z-index:5;display:flex;gap:6px;align-items:center;width:max-content;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:0 6px 20px var(--shs)}
#ct #ftb .pp[hidden]{display:none}
#ct #ftb .pp .sw{width:22px;height:22px;min-width:0;padding:0;border-radius:50%;border:1px solid var(--line2)}
#ct #ftb .pp .sw:hover{transform:scale(1.12);background-clip:padding-box}
#ct #ftb .pp .txt{height:26px;border:1px solid var(--line);padding:0 8px}
#ct #ftb #fsz{width:46px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--ink);font:600 13px "Pretendard",sans-serif;text-align:center;padding:0 2px;-moz-appearance:textfield}
#ct #ftb #fsz::-webkit-inner-spin-button,#ct #ftb #fsz::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
#ct #ftb #fsz:focus{outline:2px solid var(--green);outline-offset:-1px}
#ct #ib{gap:2px;padding:4px;border-radius:12px;box-shadow:0 2px 10px var(--shs)}
#ct #ib .lab{font-size:11px;color:var(--mute);margin:0 6px}
#ct #ib button{height:32px;padding:0 10px;border:0;background:transparent;border-radius:7px;font:600 13px "Pretendard",sans-serif;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
#ct #ib button:hover{background:var(--panel2)}
#ct #ib svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
#ct .paper>.pg{cursor:default}
#ct #ftb select{height:28px;border-radius:7px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);font:600 12px "Pretendard",sans-serif;padding:0 4px}

#ct .ftb .ic{width:32px;padding:0;display:grid;place-items:center}
#ct .ftb .ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
#ct .ftb .tg[hidden]{display:none}
#ct #ftb{padding:6px 8px}
#ct #ftb .fr{gap:4px;padding:3px 2px}
#ct #ftb .fr+.fr{margin-top:4px;padding-top:7px}
#ct #ftb .sep{margin:0 6px}
#ct #ftb .lab{margin:0 4px 0 2px}
#ct #ftb .ic.wide{width:auto;min-width:32px;padding:0 8px;gap:4px;display:inline-flex}
#ct #ftb [data-t=merge],#ct #ftb [data-t=split]{padding:0 10px}
@property --fw{syntax:'<length>';inherits:true;initial-value:0px}
@property --sw{syntax:'<length>';inherits:true;initial-value:150px}
#ct .ed{transition:--fw .32s cubic-bezier(.22,.8,.24,1),--sw .32s cubic-bezier(.22,.8,.24,1)}
@keyframes opk-pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes opk-fade{from{opacity:0}to{opacity:1}}
@keyframes opk-slide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
#ct .cal:not([hidden]),#ct #ftb:not([hidden]),#ct #ftb .pp:not([hidden]),#ct #stb:not([hidden]),#ct #bm:not([hidden]),#ct .menu-list,#ct .findbar:not([hidden]){animation:opk-pop .18s cubic-bezier(.22,.8,.24,1)}
#ct .fp:not([hidden]) .fp-list,#ct .fp:not([hidden]) .fp-help,#ct .ed .side>.tp,#ct .ed .side>.addpg{animation:opk-slide .28s cubic-bezier(.22,.8,.24,1)}
#ct .fp.float:not([hidden]){animation:opk-pop .2s cubic-bezier(.22,.8,.24,1)}
#ct .bplus:not([hidden]){animation:opk-fade .15s ease}
#ct .fp-min svg,#ct .side-tg svg{transition:transform .28s cubic-bezier(.22,.8,.24,1)}
#ct .blk,#ct .cell-sel,#ct .slot-hi{transition:background-color .15s ease}
@media(prefers-reduced-motion:reduce){#ct .ed{transition:none}#ct *{animation:none!important}}
#ct .ftb select{height:30px;border-radius:7px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);font:600 12px \"Pretendard\",sans-serif;padding:0 4px}
#ct section.art>h2{cursor:pointer}
.pg[data-lang=zh]{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",sans-serif}
#sg .bad{font-size:12px;color:var(--warn)}
#sg .combo{position:relative}
#sg .combo input{padding-right:32px}
#sg .combo::after{content:"";position:absolute;right:14px;bottom:19px;width:7px;height:7px;border-right:1.6px solid var(--mute);border-bottom:1.6px solid var(--mute);transform:rotate(45deg);pointer-events:none}
#sg .cb{position:absolute;top:100%;left:0;right:0;min-width:240px;margin-top:4px;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px var(--shs);padding:4px;max-height:300px;overflow:auto}
#sg .cb[hidden]{display:none}
#sg .cb-i{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 10px;border-radius:7px;cursor:pointer;font-size:14px;color:var(--ink)}
#sg .cb-i small{color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sg .cb-i:hover,#sg .cb-i.on{background:var(--panel2)}
#sg .org{display:flex;flex-direction:column;gap:6px;overflow-x:auto}
#sg .org-h,#sg .org-r{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr)) 64px;gap:6px;min-width:680px}
#sg .org-h span{font-size:12px;color:var(--mute)}
#sg .org-r input{height:38px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 10px;font-size:14px;color:var(--ink)}
#sg .org-r .btn{height:38px;padding:0 8px;font-size:13px}
#ct .back,#sg .back{padding:0 10px 0 4px;margin-left:-6px;gap:2px}
#ct .back svg,#sg .back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#sg .guide summary{cursor:pointer;list-style:revert}
#sg .guide ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
#sg .guide b{color:var(--ink)}
@media(max-width:800px){
 .nav{top:auto;right:0;width:auto;height:62px;flex-direction:row;align-items:center;padding:6px 8px;border-right:0;border-top:1px solid var(--line)}
 .nav .logo,.nav .label{display:none}
 .nav a{flex:1;flex-direction:column;justify-content:center;gap:2px;height:50px;font-size:11px;padding:0 4px}
 .nav .foot{margin:0}.theme{width:132px}
 .main,body.navmin .main{margin-left:0;padding-bottom:64px}
 .navtg,body.navmin .thc{display:none}
 body.navmin .nav{width:auto;padding:6px 8px}
 body.navmin .nav a span,body.navmin .theme{display:revert}
 body.navmin .nav a{flex-direction:column;padding:0 4px}
 .toast{bottom:78px!important}
}

.btn{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--line2)}
.btn:focus-visible,:is(#ct,#exp) .card:focus-visible,:is(#ct,#exp) input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.btn.pri{background:var(--green);border-color:var(--green);color:#0d1a05}
.btn.pri:hover{background:var(--green2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:default}
:is(#ct,#exp) .bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(3vw,16px);background:var(--barbg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
:is(#ct,#exp) .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
:is(#ct,#exp) .brand b{font-size:17px}
:is(#ct,#exp) .brand svg{width:46px;height:32px;flex:none}
:is(#ct,#exp) .home{padding:clamp(24px,4vw,48px) max(3vw,16px) 64px;max-width:1240px;margin:0 auto}
:is(#ct,#exp) .home h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
:is(#ct,#exp) .home .sub{color:var(--mute);margin:0 0 28px}
:is(#ct,#exp) .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:24px}
:is(#ct,#exp) .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
:is(#ct,#exp) .card:hover{border-color:var(--line2);transform:translateY(-2px)}
:is(#ct,#exp) .thumb{position:relative;aspect-ratio:794/1123;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px var(--sh)}
:is(#ct,#exp) .thumb .pg{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
:is(#ct,#exp) .thumb .n{position:absolute;right:8px;bottom:8px;background:rgba(17,17,17,.75);color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
:is(#ct,#exp) .card h3{margin:0;font-size:16px;line-height:1.35}
:is(#ct,#exp) .meta{color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
:is(#ct,#exp) .acts{display:flex;gap:4px}
:is(#ct,#exp) .acts .btn{height:32px;padding:0 10px;font-size:13px}
:is(#ct,#exp) .new{border-style:dashed;align-items:center;justify-content:center;min-height:320px;color:var(--mute);text-align:center}
:is(#ct,#exp) .new .plus{font-size:34px;line-height:1;color:var(--green)}
:is(#ct,#exp) .title-in{height:40px;min-width:180px;flex:1 1 220px;max-width:420px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--ink);font:700 17px "Pretendard",sans-serif;padding:0 10px}
:is(#ct,#exp) .title-in:hover{border-color:var(--line)}
:is(#ct,#exp) .chip{font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
:is(#ct,#exp) .chip i{width:8px;height:8px;border-radius:50%;background:var(--green)}
:is(#ct,#exp) .chip.dirty i{background:var(--warn)}
:is(#ct,#exp) .chip.err i{background:var(--err)}
:is(#ct,#exp) .menu{position:relative}
:is(#ct,#exp) .menu-list{position:absolute;right:0;top:46px;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 16px 40px var(--sh);display:none}
:is(#ct,#exp) .menu.open .menu-list{display:block}
:is(#ct,#exp) .menu-list button{display:flex;flex-direction:column;align-items:flex-start;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left}
:is(#ct,#exp) .menu-list button:hover{background:var(--panel2)}
:is(#ct,#exp) .menu-list small{color:var(--mute);font-size:12px}
:is(#ct,#exp) .hint{color:var(--mute);font-size:13px;text-align:center;padding:14px 16px 0}
:is(#ct,#exp) .desk{display:flex;flex-direction:column;align-items:center;gap:28px;padding:20px 16px 80px}
:is(#ct,#exp) .sheet{position:relative}
:is(#ct,#exp) .sheet .lbl{position:absolute;left:0;top:-22px;font-size:12px;color:var(--mute)}
:is(#ct,#exp) .paper{position:relative;background:#fff;box-shadow:0 20px 60px var(--sh);overflow:hidden}
:is(#ct,#exp) .paper>.pg{transform-origin:0 0;position:absolute;left:0;top:0}
:is(#ct,#exp) [data-ed]{outline:1px solid transparent;outline-offset:1px;border-radius:2px;cursor:text;transition:outline-color .1s,background-color .1s}
:is(#ct,#exp) [data-ed]:hover{outline-color:rgba(110,185,43,.7)}
:is(#ct,#exp) [data-ed]:focus{outline:2px solid #6eb92b;background-color:rgba(110,185,43,.08)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 10px 30px var(--sh);display:none;max-width:min(92vw,520px);z-index:50}
.toast a{color:#2f6f0f}
.toast.show{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.show{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(440px,100%)}
.dlg h4{margin:0 0 8px;font-size:18px}
.dlg p{margin:0 0 18px;color:var(--mute)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.exp{position:absolute;left:0;top:0;width:794px;background:#fff;z-index:-1;visibility:hidden}
.exp.on{visibility:visible}
.exp .pg{position:relative!important;transform:none!important}.exp .pg:not([data-lang=zh]){font-family:"Pretendard",sans-serif!important}

#sg .home h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
#sg .sub{color:var(--mute);margin:0 0 24px}
#sg .search{display:flex;align-items:center;gap:10px;margin:0 0 24px;max-width:560px;height:48px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
#sg .search:focus-within{border-color:var(--green)}
#sg .search svg{width:18px;height:18px;flex:none;color:var(--mute)}
#sg .search input{flex:1;height:100%;border:0;background:none;font-size:16px;outline:none}
#sg .search .cnt{font-size:13px;color:var(--mute);white-space:nowrap}
#sg .filters{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 24px}
#sg .pill{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:none;font-size:13px;font-weight:600;color:var(--mute)}
#sg .pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#sg .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
#sg .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:border-color .15s,transform .15s}
#sg .card:hover{border-color:var(--line2);transform:translateY(-2px)}
#sg .mini{position:relative;height:150px;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 10px 30px var(--sh)}
#sg .mini>div{position:absolute;left:16px;top:50%;width:max-content;transform-origin:0 50%;translate:0 -50%;pointer-events:none}
#sg .card h3{margin:0;font-size:16px;line-height:1.35}
#sg .meta{color:var(--mute);font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#sg .meta .btn{height:32px;padding:0 10px;font-size:13px}
#sg .new{border-style:dashed;align-items:center;justify-content:center;min-height:240px;color:var(--mute);text-align:center}
#sg .new .plus{font-size:34px;line-height:1;color:var(--green)}
#sg .empty{grid-column:1/-1;color:var(--mute);padding:40px 0;text-align:center}
#sg mark{background:rgba(110,185,43,.28);color:inherit;border-radius:3px}
#sg .ed{display:grid;grid-template-columns:minmax(320px,400px) minmax(0,1fr);align-items:start;max-width:1440px;margin:0 auto}
#sg .form{padding:20px max(2vw,16px) 80px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
#sg .grp{display:flex;flex-direction:column;gap:10px}
#sg .grp h4{margin:0;font-size:13px;font-weight:600;color:var(--mute)}
#sg .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
#sg .f{display:flex;flex-direction:column;gap:4px}
#sg .f span{font-size:12px;color:var(--mute)}
#sg .f input{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel);padding:0 12px;font-size:16px}
#sg .f input:focus{border-color:var(--green);outline:none}
#sg .seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
#sg .seg button{min-height:56px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:left;display:flex;flex-direction:column;justify-content:center}
#sg .seg button b{font-size:14px}
#sg .seg button small{font-size:12px;color:var(--mute);line-height:1.35}
#sg .seg button.on{border-color:var(--green);background:rgba(110,185,43,.1)}
#sg .logos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
#sg .lg{position:relative;height:92px;border-radius:10px;border:2px solid transparent;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 8px 6px}
#sg .lg img{max-width:100%;max-height:44px;min-height:0;display:block}
#sg .lg small{font-size:12px;color:#666;line-height:1.2}
#sg .lg.on{border-color:var(--green);box-shadow:0 0 0 3px rgba(110,185,43,.3)}
#sg .lg.none{background:var(--panel);color:var(--mute);font-size:13px;font-weight:600;border-color:var(--line)}
#sg .lg.none.on{border-color:var(--green)}
#sg .inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mute)}
#sg .inline input[type=range]{flex:1;accent-color:var(--green);height:32px}
#sg .tog{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
#sg .tog button{height:32px;padding:0 12px;border:0;border-radius:999px;background:none;font-size:13px;font-weight:600;color:var(--mute)}
#sg .tog button.on{background:var(--panel2);color:var(--ink)}
#sg .view{position:sticky;top:65px;padding:20px max(2vw,16px) 40px;display:flex;flex-direction:column;gap:14px}
#sg .vbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#sg .mail{background:#fff;color:#222;border-radius:10px;box-shadow:0 20px 60px var(--sh);overflow:hidden;margin:0 auto;width:100%;max-width:680px;transition:max-width .2s}
#sg .mail.mob{max-width:375px}
#sg .mhead{padding:14px 20px;border-bottom:1px solid #e6e6e6;font-size:13px;color:#666;line-height:1.7}
#sg .mhead b{color:#111;font-weight:600}
#sg .mbody{padding:20px;font:14px/1.7 "Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;color:#222;overflow-x:auto}
#sg .mbody p{margin:0 0 14px}
#sg .sigwrap{margin-top:22px;padding-top:4px}
#sg .mail.noimg .sigwrap img{visibility:hidden}
#sg .acts{display:flex;gap:8px;flex-wrap:wrap}
#sg .note{font-size:13px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;line-height:1.55}
#sg .note.warn{border-color:rgba(229,168,59,.5)}
#sg .note b{color:var(--ink)}
#sg .set{max-width:760px;margin:0 auto;padding:clamp(24px,4vw,40px) max(3vw,16px) 80px;display:flex;flex-direction:column;gap:24px}
#sg .set h1{font-size:clamp(26px,3.6vw,36px);margin:0;line-height:1.15;letter-spacing:-.01em}
#sg .urlrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:10px;align-items:center}
#sg .urlrow .lg{height:60px}
#sg .urlrow .lg img{max-height:40px}
#clip{position:fixed;left:-9999px;top:0;background:#fff;color:#000}
@media(max-width:900px){#sg .ed{grid-template-columns:minmax(0,1fr)}
#sg .form{border-right:0;padding-bottom:20px}
#sg .view{position:static;order:-1;border-bottom:1px solid var(--line)}
}
@media(max-width:600px){#sg .grid{grid-template-columns:minmax(0,1fr)}
#sg .row2{grid-template-columns:minmax(0,1fr)}
#sg .bar{gap:8px}
#sg .urlrow{grid-template-columns:minmax(0,1fr)}
}
@media(prefers-reduced-motion:reduce){#sg .card,#sg .mail{transition:none}
#sg .card:hover{transform:none}
}

</style>

  let ctState = 'pending';
  const toolOf = h => /^#(contracts|c-.+)$/.test(h) ? 'ct' : 'sg';
  window.OPK = {

    state: () => ctState,

  };
}

<script>
{
const TPL = JSON.parse(document.getElementById('tpl').textContent);
const LOGO = TPL.logo;

const W = 794, H = 1123;
const ROOT = document.getElementById('ct');
const GLOBAL_IDS = /^#(toast|modal|mtitle|mtext|mrow|exp|clip|busy)$/;
const $ = s => GLOBAL_IDS.test(s) ? document.querySelector(s) : ROOT.querySelector(s);
const active = () => location.hash === '#contracts' || /^#c-/.test(location.hash);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = ROOT;
let db = null, canWrite = true, store = {}, cur = null, dirty = false, saving = false, local = false;

/* ---------- data ---------- */
function sanitizePage(html){
  const d = new DOMParser().parseFromString('<body>' + String(html) + '</body>', 'text/html');
  d.querySelectorAll('script,style,iframe,object,embed,link,meta,foreignObject,form,input,button,textarea').forEach(n => n.remove());
  d.querySelectorAll('*').forEach(el => {
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase(), v = a.value;
      if (n.startsWith('on')) el.removeAttribute(a.name);
      else if ((n === 'href' || n === 'src' || n === 'xlink:href') && !/^data:image\//i.test(v) && !v.startsWith('#')) el.removeAttribute(a.name);
      else if (n === 'style' && /url\s*\(|expression/i.test(v)) el.removeAttribute(a.name);
    }
  });
  const pg = d.body.querySelector('.pg');
  return pg ? pg.outerHTML : '';
}
function list(){
  return Object.entries(store).map(([id, c]) => ({...c, id})).sort((a, b) => (b.base ? 1 : 0) - (a.base ? 1 : 0) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));
}
function get(id){ return list().find(c => c.id === id); }
function loadLocal(){ try { store = JSON.parse(localStorage.getItem('opk-contracts') || '{}'); } catch { store = {}; } }
function saveLocal(){ try { localStorage.setItem('opk-contracts', JSON.stringify(store)); return true; } catch { return false; } }
async function persist(id, data){
  if (db) { await db.doc('contracts/' + id).set(data); }
  else { store[id] = data; if (!saveLocal()) throw new Error('local'); }
}

/* ---------- ui helpers ---------- */
let tt;
function toast(msg, html){ const t = $('#toast'); if (html) t.innerHTML = msg; else t.textContent = msg; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), html ? 12000 : 3200); }
function ask(title, text, buttons){
  return new Promise(res => {
    $('#mtitle').textContent = title; $('#mtext').textContent = text;
    const row = $('#mrow'); row.innerHTML = '';
    buttons.forEach(([label, val, cls]) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = () => { $('#modal').classList.remove('show'); res(val); }; row.appendChild(b); });
    $('#modal').classList.add('show'); row.lastChild.focus();

/* ---------- 사진으로 새 계약서 ---------- */
const PHOTO_PROMPT = `첨부한 계약서 사진(여러 장이면 순서대로 한 계약서)을 읽고, 내용을 아래 JSON 하나로만 돌려줘. 설명이나 코드블록 없이 JSON만.
규칙:
- 문서에 적힌 문구를 그대로 옮겨. 없는 내용은 지어내지 말고 빈 문자열이나 빈 배열로.
- 금액·날짜·전화·계좌·주소·이름은 글자 그대로.
- 조항(제1조, 제2조…) 순서를 지켜. "계약당사자" 조항은 articles 에 넣지 말고 owner/contractor 에 넣어.
- 조항 안의 번호 목록은 list 로, "항목: 내용" 짝은 kv 로, 표는 table 로, 총 금액은 amount 로, 강조된 안내 문단은 note 로.
- list 항목은 원래 번호(1., ①, • 등)를 앞에 그대로 붙여.
- "제N조" 없이 맨 바깥 번호(1. 2. 3. …)로 나뉜 양식(예: 표준도급계약서 표지)이면, 그 번호 하나하나를 articles 의 조항 하나로 만들어. 여러 번호를 한 조항으로 묶지 마. 번호가 13개면 articles 도 13개.
  · title 은 번호 뒤 항목 이름만, 글자 사이 띄어쓰기는 붙여서 (예: "1. 공 사 명 :" → "공사명", "3. 착공년월일" → "착공년월일").
  · 콜론 뒤 값과 그 번호 아래 딸린 줄(괄호 줄 "(노무비) …", 각주 "1) …", ①·가. 하위 항목)은 그 조항의 blocks 로 (text, list).
  · 번호 안의 표는 그 조항의 table 로.
- 비어 있는 칸은 비운 모양 그대로 옮겨 (예: "년 월 일", "일금 원정", "( )월에 1회", "( )%"). 0 이나 예시 값을 채우지 마.
- 당사자가 "도급인/수급인"처럼 다른 이름이면 role 에 그 이름 그대로. 아래 서명란에만 있는 주소·성명도 owner/contractor rows 에 (["주소",""],["성명",""]).
- 맨 끝 맺음 문단(“도급인”과 “수급인”은 … 보관한다)과 붙임서류 목록은 articles 가 아니라 outro 에 줄마다 넣어.
{
 "title": "계약서 제목 (예: 타일 공사 계약서)",
 "kicker": "영문 소제목 (없으면 CONSTRUCTION CONTRACT)",

function sigText(s){

}

function combo(input, source, onPick){
  const wrap = input.parentElement; wrap.classList.add('combo');
  const box = document.createElement('div'); box.className = 'cb'; box.hidden = true; box.setAttribute('role', 'listbox'); box.id = 'cb-' + input.dataset.k; wrap.appendChild(box);
  input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list'); input.setAttribute('aria-expanded', 'false'); input.setAttribute('aria-controls', box.id);
  let items = [], idx = -1;
  const close = () => { box.hidden = true; idx = -1; input.setAttribute('aria-expanded', 'false'); };
  const render = () => {
    items = source().filter(it => matchQ(it.key, input.value)).slice(0, 12);
    if (!items.length) { close(); return; }
    box.innerHTML = items.map((it, i) => `<div class="cb-i${i === idx ? ' on' : ''}" role="option" aria-selected="${i === idx}" data-i="${i}"><span>${esc(it.main)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</div>`).join('');
    box.hidden = false; input.setAttribute('aria-expanded', 'true');

  };
  input.addEventListener('focus', () => { idx = -1; render(); });
  input.addEventListener('input', () => { idx = -1; render(); });
  input.addEventListener('keydown', e => {
    if (box.hidden) { if (e.key === 'ArrowDown') { render(); e.preventDefault(); } return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = Math.min(items.length - 1, idx + 1); render(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = Math.max(0, idx - 1); render(); }

}

  const clean = () => { const o = {...DEF_CO}; FIELDS_C.forEach(k => o[k] = String(c[k] || '').slice(0, 200)); o.layout = c.layout; o.logo = c.logo; o.logoH = c.logoH || 44; o.org = (c.org || []).filter(p => p.nameKo || p.nameEn).map(p => { const q = {}; ['nameKo','nameEn','titleKo','titleEn','deptKo','deptEn','logo'].forEach(k => { if (p[k]) q[k] = String(p[k]).slice(0, 80); }); return q; }); o.urls = {}; LOGOS.forEach(l => { const u = imgUrl(c.urls[l.id]); if (u) o.urls[l.id] = u; }); return o; };
  const cs = $('#csave'); if (cs) cs.onclick = async () => { try { const o = clean(); await putCo(o); co = o; toast('저장했어요.'); } catch { toast('저장하지 못했어요.'); } };
  const ap = $('#apply'); if (ap) ap.onclick = async () => {
    const n = Object.keys(sigs).length; if (!n) { toast('아직 서명이 없어요.'); return; }
    if (await ask('모든 서명에 적용할까요?', `서명 ${n}개의 회사 전화·팩스·회사명·주소·웹사이트·소개 문구를 이 값으로 바꿔요.\n이름·직통 휴대폰·메일·양식·로고는 그대로예요.`, [['취소', false, 'ghost'], ['적용', true, 'pri']]) !== true) return;
    try { const o = clean(); await putCo(o); co = o; for (const [id, s] of Object.entries(sigs)) { const d = {...s}; FIELDS_C.forEach(k => d[k] = o[k]); d.updatedAt = new Date().toISOString(); await putSig(id, cleanSig(d)); if (!db) sigs[id] = cleanSig(d); } toast(`서명 ${n}개에 적용했어요.`); }
    catch { toast('일부를 적용하지 못했어요. 다시 눌러 주세요.'); }
  };
}

/* ---------- routing & boot ---------- */
async function route(){
  if (!active()) return;
  const h = location.hash.replace(/^#/, '');
  const m = h.match(/^s-([A-Za-z0-9-]+)$/);
  if (cur && dirty && canWrite && (!m || (m[1] !== cur.id && !(cur.isNew && m[1] === 'new')))) {
    const v = await ask('저장하지 않은 수정이 있어요', '저장하고 나갈까요?', [['취소', 'cancel', 'ghost'], ['저장 안 함', 'drop'], ['저장', 'save', 'pri']]);
    if (v === 'cancel') { history.replaceState(null, '', '#s-' + (cur.isNew ? 'new' : cur.id)); return; }
    if (v === 'save') await save();
    dirty = false;
  }
  if (m && cur && (cur.id === m[1] || (cur.isNew && m[1] === 'new')) && ROOT.querySelector('#form')) return;
  if (h === 'company') renderCompany(); else if (m) renderEditor(m[1]); else renderHome();
}
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (!active()) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 's' && cur) { e.preventDefault(); save(); }
  else if (mod && k === 'k' && !cur) { e.preventDefault(); $('#q')?.focus(); }
  else if (k === '/' && !cur && document.activeElement?.tagName !== 'INPUT') { e.preventDefault(); $('#q')?.focus(); }
});
window.addEventListener('beforeunload', e => { if (dirty && canWrite) { e.preventDefault(); e.returnValue = ''; } });
// logo files -> data URLs for copying
Promise.all(LOGOS.map(async l => { try { const b = await (await fetch(l.file)).blob(); DATA[l.id] = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }); } catch {} }));
loadLocal(); route();
(async () => {
  const [d, u, dw] = await Promise.all(['db', 'user', 'downloads'].map(n => (window.claude?.use ? window.claude.use(n) : Promise.resolve(null)).catch(() => null)));
  dl = dw;
  if (u && u.can) { try { if (await u.can('data.write') === false) canWrite = false; } catch {} }
  if (d) {
    db = d; local = false; sigs = {};
    const timer = setTimeout(() => toast('저장된 서명을 아직 불러오지 못했어요.'), 10000);
    let first = true;
    db.collection('signatures').onSnapshot(snap => {
      clearTimeout(timer); const next = {};
      for (const doc of snap.docs) next[doc.id] = cleanSig(doc.data());
      sigs = next;
      if (!cur && location.hash !== '#company' && active()) renderHome();
      else if (cur && first && !dirty && !cur.isNew) renderEditor(cur.id);
      first = false;
    }, () => { clearTimeout(timer); toast('저장소에 연결하지 못했어요. 이 브라우저에만 저장돼요.'); db = null; local = true; loadLocal(); if (!cur) renderHome(); });
    db.doc('settings/company').onSnapshot(doc => { let v = null; try { v = doc?.data?.() || null; } catch {} if (v) { co = {...DEF_CO, ...v, urls: {...(v.urls || {})}}; co.logo = normLogo(co.logo); } if (cur) paint(); }, () => {});
  } else if (!cur) route();
})();
}
</script>
<script>
{
  const last = {ct: 'contracts', sg: 'sign'};
  const navCt = document.getElementById('navCt'), navSg = document.getElementById('navSg');
  function show(){
    const t = OPK.toolOf(location.hash);
    if (t === 'ct' && OPK.state() === 'no') { location.hash = 'sign'; return; }
    last[t] = location.hash.slice(1) || last[t];
    document.getElementById('ct').hidden = t !== 'ct';
    document.getElementById('sg').hidden = t !== 'sg';
    navCt.classList.toggle('on', t === 'ct'); navSg.classList.toggle('on', t === 'sg');
    navCt.setAttribute('aria-current', t === 'ct' ? 'page' : 'false'); navSg.setAttribute('aria-current', t === 'sg' ? 'page' : 'false');
    document.title = (t === 'ct' ? '계약서' : '메일 서명') + ' · OPK 업무 도구';
    try { localStorage.setItem('opk-tool', t); } catch {}
  }
  [navCt, navSg].forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); const t = a.dataset.tool;
    const target = OPK.toolOf(location.hash) === t ? (t === 'ct' ? 'contracts' : 'sign') : last[t];
    if (location.hash.slice(1) === target) return; location.hash = target;
  }));
  window.addEventListener('hashchange', show); show();
  const btns = [...document.querySelectorAll('.theme [data-t]')];
  const NAMES = {auto: '자동', light: '라이트', dark: '다크'}, thc = document.getElementById('thc');
  const paint = v => { btns.forEach(b => { b.classList.toggle('on', b.dataset.t === v); b.setAttribute('aria-pressed', b.dataset.t === v); }); thc.textContent = NAMES[v]; thc.title = '화면: ' + NAMES[v] + ' (눌러서 바꾸기)'; };
  const setTheme = v => { if (v === 'auto') delete document.documentElement.dataset.mode; else document.documentElement.dataset.mode = v; paint(v); cur = v; try { localStorage.setItem('opk-theme', v); } catch {} };
  let cur = 'auto'; try { cur = localStorage.getItem('opk-theme') || 'auto'; } catch {}
  paint(cur);
  btns.forEach(b => b.onclick = () => setTheme(b.dataset.t));
  thc.onclick = () => setTheme({auto: 'light', light: 'dark', dark: 'auto'}[cur] || 'auto');
  const tg = document.getElementById('navTg');
  const setMin = on => { document.body.classList.toggle('navmin', on); tg.setAttribute('aria-expanded', !on); tg.setAttribute('aria-label', on ? '메뉴 펴기' : '메뉴 접기'); try { localStorage.setItem('opk-navmin', on ? '1' : ''); } catch {} };
  let min = false; try { min = localStorage.getItem('opk-navmin') === '1'; } catch {}
  setMin(min); tg.onclick = () => { setMin(!document.body.classList.contains('navmin')); tg.blur(); };
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === '\\') { e.preventDefault(); tg.click(); } });
}

</script>
<script>
{
  // 데이터 백업: 내보내기(파일·복사) / 가져오기(파일·붙여넣기) — 관리자만
  const COLS = ['contracts', 'signatures', 'settings'];
  let dbx = null;
  const once = col => new Promise((res, rej) => { let un = null; const t = setTimeout(() => rej(new Error('timeout')), 15000);
    un = dbx.collection(col).onSnapshot(s => { clearTimeout(t); const out = {}; s.docs.forEach(d => { out[d.id] = d.data(); }); try { un && un(); } catch {} res(out); }, e => { clearTimeout(t); rej(e); }); });
  async function dump(){ const all = {}; for (const c of COLS) all[c] = await once(c); return all; }
  const toastMsg = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastMsg.t); toastMsg.t = setTimeout(() => t.classList.remove('show'), 4000); };
  function dlg(){
    const wrap = document.createElement('div'); wrap.className = 'modal show'; wrap.setAttribute('role', 'dialog'); wrap.setAttribute('aria-modal', 'true');
    wrap.innerHTML = `<div class="dlg" style="width:min(520px,100%)"><h4>데이터 백업·옮기기</h4>
      <p>계약서·메일 서명·회사 공통 정보를 한 묶음으로 내보내거나 가져와요. 가져오면 같은 항목은 덮어써요.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><button class="btn" data-a="copy">복사하기</button><button class="btn" data-a="file">파일로 받기</button></div>
      <textarea aria-label="가져올 데이터" placeholder="여기에 복사한 데이터를 붙여 넣거나 아래에서 파일을 고르세요" style="width:100%;height:120px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:10px;font:13px/1.4 ui-monospace,monospace;resize:vertical"></textarea>
      <div class="row" style="margin-top:12px;justify-content:space-between"><button class="btn ghost" data-a="pick">파일 고르기</button><span style="display:flex;gap:8px"><button class="btn ghost" data-a="close">닫기</button><button class="btn pri" data-a="import">가져오기</button></span></div></div>`;
    document.body.appendChild(wrap);
    const ta = wrap.querySelector('textarea'), close = () => wrap.remove();
    wrap.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
    wrap.onclick = async e => {
      const b = e.target.closest('[data-a]'); if (!b) { if (e.target === wrap) close(); return; }
      const a = b.dataset.a;
      try {
        if (a === 'close') close();
        else if (a === 'copy') { const txt = JSON.stringify(await dump()); try { await navigator.clipboard.writeText(txt); } catch { ta.value = txt; ta.select(); document.execCommand('copy'); } toastMsg('전체 데이터를 복사했어요. 옮길 곳의 이 창에 붙여 넣으세요.'); }
        else if (a === 'file') { const blob = new Blob([JSON.stringify(await dump(), null, 1)], {type: 'application/json'}); const dl = await window.claude.use('downloads'); const name = `opk-tools-backup-${new Date().toISOString().slice(0, 10)}.json`; if (dl) await dl.save({filename: name, data: blob}); else toastMsg('이 화면에서는 파일 저장을 쓸 수 없어요. 복사하기를 써 주세요.'); }
        else if (a === 'pick') { const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json'; i.onchange = async () => { if (i.files[0]) ta.value = await i.files[0].text(); }; i.click(); }
        else if (a === 'import') {
          let data; try { data = JSON.parse(ta.value); } catch { toastMsg('붙여 넣은 내용이 백업 데이터가 아니에요.'); return; }
          const jobs = []; for (const c of COLS) for (const [id, v] of Object.entries(data?.[c] || {})) if (/^[A-Za-z0-9_-]{1,64}$/.test(id) && v && typeof v === 'object') jobs.push([c, id, v]);
          if (!jobs.length) { toastMsg('가져올 항목이 없어요.'); return; }
          b.disabled = true; let ok = 0;
          for (const [c, id, v] of jobs) { try { await dbx.doc(c + '/' + id).set(v); ok++; b.textContent = `가져오는 중 ${ok}/${jobs.length}`; } catch (er) { console.warn(c, id, er); } }
          toastMsg(`${ok}개 항목을 가져왔어요. 새로고침하면 반영돼요.`); setTimeout(() => location.reload(), 1200);
        }
      } catch (er) { console.error(er); toastMsg('처리하지 못했어요. 다시 해 주세요.'); }
    };
    ta.focus();
  }
  (async () => {
    if (!window.claude?.use) return;
    const [d, u] = await Promise.all(['db', 'user'].map(n => window.claude.use(n).catch(() => null)));
    if (!d || !u) return; try { if (await u.canEdit() !== true) return; } catch { return; }
    dbx = d;
    const foot = document.querySelector('.nav .foot'); if (!foot) return;
    const b = document.createElement('button'); b.className = 'thc'; b.style.display = 'block'; b.textContent = '백업'; b.title = '데이터 백업·옮기기'; b.setAttribute('aria-label', '데이터 백업·옮기기'); b.onclick = dlg;
    foot.prepend(b);
  })();
}

</script>
