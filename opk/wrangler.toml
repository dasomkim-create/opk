# OPK 업무 도구 — 홈페이지(opk-korea-main)와 완전히 분리된 별도 Worker / D1 입니다.
name = "opk-vitools"
main = "src/worker.js"
compatibility_date = "2025-06-01"
# 대시보드에서 넣은 변수가 Git 배포 때 지워지지 않게
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "opk-tools"
database_id = "1b1ba8ad-8726-45f8-8da3-a24222897078"

# 무료 AI (사진으로 계약서 만들기·번역). ANTHROPIC_API_KEY 를 넣으면 Claude 를 대신 씁니다.
[ai]
binding = "AI"

[vars]
# (선택) Cloudflare Access 로 로그인할 때만. 비워 두면 ADMIN_PASSWORD / STAFF_PASSWORD 비밀번호 로그인
ACCESS_TEAM_DOMAIN = ""   # 예: opk.cloudflareaccess.com
ACCESS_AUD = ""           # Access 애플리케이션의 Application Audience (AUD) Tag
# 계약서를 보고 고칠 수 있는 관리자 메일 (쉼표로 구분)
ADMIN_EMAILS = ""
# AI 번역에 쓸 모델 (ANTHROPIC_API_KEY 는 secret 으로 따로 넣기)
ANTHROPIC_MODEL = "claude-sonnet-4-5"
WORKERS_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
# 로그인 아이디 (비밀번호는 Worker 설정 → 변수 및 시크릿 → LOGIN_PASSWORD 에 Secret 으로만 넣기)
LOGIN_ID = "opkvitooladmin"
